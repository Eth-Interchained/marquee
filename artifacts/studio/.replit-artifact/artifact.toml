kind = "web"
previewPath = "/"
title = "marquee"
description = "A creator desktop: broadcast studio (screen, camera, go live), a real terminal, and human-approved social publishing through your own signed-in sessions."
version = "1.0.0"
id = "artifacts/studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26253

[services.development]
run = "pnpm --filter @marquee/studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@marquee/studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26253"
BASE_PATH = "/"
