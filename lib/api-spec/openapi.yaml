openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI-assisted social content operations
  - name: publish
    description: Human-approved publishing through an authenticated workspace session
  - name: tenancy
    description: Tenant resolution for the current request
  - name: studio
    description: The Studio's receipts — go-live, scene and source events chained by cause in the local store
paths:
  /tenant:
    get:
      operationId: getTenant
      tags: [tenancy]
      summary: Resolve the tenant that owns the current request
      responses:
        "200":
          description: Tenant context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantInfo"
        "401":
          description: Multi-tenant mode is enabled but the request is unauthenticated
  /session/status:
    get:
      operationId: getSessionStatus
      tags: [publish]
      summary: Report whether a workspace session can post right now
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            type: string
        - name: platform
          in: query
          required: false
          description: >-
            Which network's session to read inside this workspace. Defaults to
            the workspace's own platform. A workspace may hold accounts on more
            than one network, and each is a separate session.
          schema:
            type: string
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
  /session/signin:
    post:
      operationId: beginSignIn
      tags: [publish]
      summary: Open a live sign-in for a workspace inside the desktop shell
      description: >-
        Opens the network's own login page in this workspace's tab, under the
        workspace's isolated session and UA profile. Credentials are typed into
        the network's page: this app never sees, fills, or stores them, and no
        API token is minted anywhere. Returns as soon as the tab is up, because
        a human sign-in takes minutes and may involve a second factor. Whether
        the operator finished is answered by GET /session/status reading the
        session back — never by this call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: What happened when a sign-in was requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInInvitation"
        "400":
          description: workspaceId is missing
  /session/signout:
    post:
      operationId: signOutOfSession
      tags: [publish]
      summary: Destroy one network's session inside a workspace
      description: >-
        Removes the cookies this workspace holds for one network, then reads
        the session back and reports what that read said. Scoped to a single
        network because a workspace may hold accounts on several and each is
        its own session. `signedOut` is the answer of the verification, never
        of the removal itself: a sign-out reported without checking is the same
        class of claim as a post reported without confirmation. A session kept
        outside cookies (Bluesky and Mastodon use local storage) is reported as
        not signed out, with a reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignOutRequest"
      responses:
        "200":
          description: What the shell found when it tried, and what the session says now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResult"
  /publish:
    post:
      operationId: publishPost
      tags: [publish]
      summary: Post approved content through the workspace's authenticated session
      description: >-
        Submits an already human-approved post through the browser session that
        belongs to the workspace. The request is rejected unless an explicit
        human approval is attached. Requires the native session bridge; there is
        no server-side fallback that posts on the user's behalf.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "200":
          description: Post accepted by the platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResult"
        "400":
          description: Invalid request
        "409":
          description: Approval missing or the workspace session is not signed in
        "502":
          description: The platform rejected the post
        "503":
          description: The session bridge is not available in this runtime
  /media:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Store an image or video for attachment to a draft
      description: >-
        Accepts raw bytes and stores them content-addressed under the data
        directory, returning a reference. The bytes stay on disk: a draft, and
        later a publish request, carry only the reference, because the browser
        state document is rewritten whole on every edit and must not grow by
        the size of an image.
      parameters:
        - in: header
          name: x-filename
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: Original filename, used as the upload's name on the network.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedMedia"
        "400":
          description: Missing filename, empty body, or an unsupported type
        "413":
          description: The file is larger than this build accepts
  /media/{id}:
    get:
      operationId: getMedia
      tags: [media]
      summary: Read stored bytes back, for preview
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The stored bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No such upload
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/models:
    get:
      operationId: listAiModels
      tags: [ai]
      summary: List available AiAssist models
      responses:
        "200":
          description: Available models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModelList"
  /ai/suggest:
    post:
      operationId: createAiSuggestion
      tags: [ai]
      summary: Generate social post suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSuggestionInput"
      responses:
        "200":
          description: Generated suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSuggestionResult"
        "400":
          description: Invalid request
        "502":
          description: AiAssist request failed
  /ai/brief:
    post:
      operationId: createAiBrief
      tags: [ai]
      summary: Turn a conversation into a proposed composer brief
      description: >-
        Prompt mode. The operator describes what they want in plain language and
        the model proposes the composer's settings — platform, task, tone,
        audience, notes, how many options. It PROPOSES only: the answer is
        applied to the form the operator can see and edit, and generating still
        takes their click. Nothing here reaches a network.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiBriefInput"
      responses:
        "200":
          description: A proposed brief, plus the model's reply to the operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiBriefResult"
        "400":
          description: Invalid request
        "502":
          description: AiAssist request failed
  /studio/events:
    get:
      operationId: listStudioEvents
      tags: [studio]
      summary: The Studio's event log for a workspace, newest first
      description: >-
        Every go-live, stream end, scene save and source change is an
        append-only document in the local NEDB store, chained to what caused
        it. This is the receipt trail: what appeared on air, and why.
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: number, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: Events newest first, with the store's integrity head
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioEventList"
    post:
      operationId: recordStudioEvent
      tags: [studio]
      summary: Record a Studio event with its causes
      description: >-
        Appends one event. `causedBy` names earlier event ids; each becomes a
        `caused_by` edge in the store's graph so TRACE can walk from an alert
        or a stream back to what produced it. The previous event on the same
        workspace is linked automatically, so the chain is never broken by a
        caller that forgot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioEventInput"
      responses:
        "201":
          description: The stored event and the receipt (store head after the write)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioEventReceipt"
        "400":
          description: Invalid event
        "404":
          description: A cause named in causedBy does not exist
  /studio/events/{id}/trace:
    get:
      operationId: traceStudioEvent
      tags: [studio]
      summary: Causes and effects of one event
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The event, what caused it (transitively), and what it caused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioEventTrace"
        "404":
          description: No such event
  /studio/scenes/{workspaceId}:
    get:
      operationId: getStudioScene
      tags: [studio]
      summary: The saved scene for a workspace
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The scene document as last saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSceneDocument"
        "404":
          description: No scene saved yet
    put:
      operationId: saveStudioScene
      tags: [studio]
      summary: Save the scene and record a scene_saved event
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioSceneInput"
      responses:
        "200":
          description: The stored scene and the scene_saved event's receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSceneSaved"
        "400":
          description: Invalid scene
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiModel:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
          description: >-
            Which gateway provider serves it. Used to group the picker — an
            account with four providers configured lists dozens of models, and
            a flat list of dozens is not a menu.
        modality:
          type: string
          description: >-
            What the model is FOR. `audio` models sit in the same catalogue as
            chat models and picking one for a text post fails in a way the
            operator cannot anticipate from the menu. Absent on an older
            gateway, in which case nothing is filtered — hiding models because
            a field is missing would be worse than listing one that fails.
          enum: [chat, audio]
    AiModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/AiModel"
    AiBriefTurn:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [operator, model]
        content:
          type: string
          minLength: 1
          maxLength: 4000
    AiBriefInput:
      type: object
      required: [platform, conversation]
      properties:
        platform:
          type: string
          description: The workspace's network, as the starting assumption.
          enum: [x, instagram, facebook, threads, linkedin, bluesky, mastodon, reddit, tiktok, youtube, pinterest, tumblr]
        conversation:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/AiBriefTurn"
        model:
          type: string
        provider:
          type: string
          description: >-
            Which gateway provider serves the chosen model, from /ai/models.
            Sent as X-AiAssist-Provider so the request reaches the vendor that
            actually has the model. Omitted when unknown, in which case the
            gateway infers it from the model id.
    AiBriefProposal:
      type: object
      description: >-
        Every field is optional on purpose. A first message rarely settles all
        of them, and inventing an audience the operator never mentioned is
        worse than leaving the field alone — the form keeps its current value
        and the operator is not misled about what they said.
      properties:
        platform:
          type: string
          enum: [x, instagram, facebook, threads, linkedin, bluesky, mastodon, reddit, tiktok, youtube, pinterest, tumblr]
        task:
          type: string
          enum: [suggest, rewrite, shorten, expand, variants, hashtags]
        tone:
          type: string
          maxLength: 100
        audience:
          type: string
          maxLength: 200
        sourceText:
          type: string
          maxLength: 12000
        numberOfSuggestions:
          type: number
          minimum: 1
          maximum: 8
        includeHashtags:
          type: boolean
    AiBriefResult:
      type: object
      required: [reply, proposal, usage]
      properties:
        reply:
          type: string
          description: What to show the operator in the conversation.
        proposal:
          $ref: "#/components/schemas/AiBriefProposal"
        missing:
          type: array
          description: >-
            Fields the model could not responsibly fill from what was said. The
            client shows these as still needing the operator, rather than
            hiding a gap behind a plausible guess.
          items:
            type: string
        mismatch:
          type: string
          nullable: true
          description: >-
            Set when the tool call's tag and its payload disagree about which
            fields are being filled in — `<<<SET_BRIEF TONE||AUDIENCE>>>` that
            then sends only `tone`. The tag is a stated intention, so a
            disagreement is reported to the operator rather than quietly
            resolved in favour of one side.
        usage:
          $ref: "#/components/schemas/AiUsage"
    AiSuggestionInput:
      type: object
      required: [platform, task, tone, audience, sourceText]
      properties:
        platform:
          type: string
          enum: [x, instagram, facebook, threads, linkedin, bluesky, mastodon, reddit, tiktok, youtube, pinterest, tumblr]
        task:
          type: string
          enum: [suggest, rewrite, shorten, expand, variants, hashtags]
        tone:
          type: string
          minLength: 1
          maxLength: 100
        audience:
          type: string
          minLength: 1
          maxLength: 200
        sourceText:
          type: string
          minLength: 3
          maxLength: 12000
        model:
          type: string
        provider:
          type: string
          description: >-
            Which gateway provider serves the chosen model, from /ai/models.
            Sent as X-AiAssist-Provider so the request reaches the vendor that
            actually has the model. Omitted when unknown, in which case the
            gateway infers it from the model id.
        numberOfSuggestions:
          type: number
          minimum: 1
          maximum: 8
          default: 3
        maxCharacters:
          type: number
          minimum: 40
          maximum: 5000
          default: 1300
        includeHashtags:
          type: boolean
          default: true
    AiSuggestion:
      type: object
      required: [text, rationale, characterCount]
      properties:
        text:
          type: string
        rationale:
          type: string
        characterCount:
          type: number
    AiUsage:
      type: object
      required: [inputTokens, outputTokens]
      properties:
        inputTokens:
          type: number
        outputTokens:
          type: number
    AiSuggestionResult:
      type: object
      required: [suggestions, model, usage, provider]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/AiSuggestion"
        model:
          type: string
        provider:
          type: string
          enum: [pin]
        usage:
          $ref: "#/components/schemas/AiUsage"
    TenantInfo:
      type: object
      required: [id, mode, label]
      properties:
        id:
          type: string
          description: Scope key every stored document is written under
        mode:
          type: string
          enum: [single, multi]
        label:
          type: string
    SessionStatus:
      type: object
      required: [workspaceId, bridgeAvailable, authenticated, detail]
      properties:
        workspaceId:
          type: string
        bridgeAvailable:
          type: boolean
          description: True when the native browser session bridge is reachable
        authenticated:
          type: boolean
          description: True when the workspace session is signed in to the platform
        accountHandle:
          type: string
          description: >-
            The signed-in handle, read from the network's own signed-in page in
            this workspace's session. Absent when it could not be read — it is
            never the workspace's stored label, because presenting a stored
            string as the signed-in account is a claim nothing verified.
        accountId:
          type: string
          description: >-
            Stable account id from the partition's own cookies. Proof of which
            account holds this session, but not a name.
        handleSource:
          type: string
          enum: [session]
          description: >-
            Present only alongside accountHandle, and only ever "session", so a
            caller cannot mistake an absent handle for a stored one.
        handleUnknown:
          type: string
          description: Why the handle is absent, phrased for the operator.
        detail:
          type: string
    SignOutRequest:
      type: object
      required: [workspaceId]
      properties:
        workspaceId:
          type: string
        platform:
          type: string
          description: >-
            Which network to sign out of inside this workspace. Defaults to the
            workspace's own platform. Only this network's cookies are removed —
            other accounts in the same workspace keep their sessions.
    SignOutResult:
      type: object
      required: [signedOut, detail]
      properties:
        signedOut:
          type: boolean
          description: >-
            Whether the session reads signed out *after* the attempt. False
            means the account is still usable and must not be treated as gone.
        detail:
          type: string
          description: Shown to the operator verbatim.
    SignInRequest:
      type: object
      required: [workspaceId]
      properties:
        workspaceId:
          type: string
        platform:
          type: string
          description: >-
            Which network to sign in to inside this workspace. Defaults to the
            workspace's own platform. The login page always opens in this
            workspace's tab, under its isolated session and UA profile.
    SignInInvitation:
      type: object
      required: [workspaceId, bridgeAvailable, opened, alreadySignedIn, detail]
      properties:
        workspaceId:
          type: string
        bridgeAvailable:
          type: boolean
          description: True when the native browser session bridge is reachable
        opened:
          type: boolean
          description: True when a sign-in tab is now in front of the operator
        alreadySignedIn:
          type: boolean
          description: >-
            True when the workspace already had a session, so no tab was needed.
            Never a claim about a sign-in that just happened.
        detail:
          type: string
    Approval:
      type: object
      required: [approvedBy, approvedAt]
      description: Human sign-off captured in the UI before anything is posted
      properties:
        approvedBy:
          type: string
          minLength: 1
          maxLength: 120
        approvedAt:
          type: string
    PublishRequest:
      type: object
      required: [workspaceId, draftId, platform, body, approval]
      properties:
        workspaceId:
          type: string
        draftId:
          type: string
        platform:
          type: string
          enum: [x, instagram, facebook, threads, linkedin, bluesky, mastodon, reddit, tiktok, youtube, pinterest, tumblr]
        body:
          type: string
          minLength: 1
          maxLength: 12000
        approval:
          $ref: "#/components/schemas/Approval"
        media:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/MediaRef"
        idempotencyKey:
          type: string
    MediaRef:
      type: object
      description: >-
        A reference to a stored upload. The bytes never travel in the browser
        state document or in a publish request; only this reference does, and
        the sha256 is what proves the file the shell uploads is the file the
        operator approved.
      required: [id, sha256, filename, mimeType, bytes]
      properties:
        id:
          type: string
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        filename:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          minLength: 1
          maxLength: 255
        bytes:
          type: number
          minimum: 1
        altText:
          type: string
          maxLength: 2000
    UploadedMedia:
      type: object
      required: [media]
      properties:
        media:
          $ref: "#/components/schemas/MediaRef"
    PublishResult:
      type: object
      required: [draftId, status, platform, attemptedAt]
      properties:
        draftId:
          type: string
        status:
          type: string
          enum: [published, failed]
        platform:
          type: string
        attemptedAt:
          type: string
        postUrl:
          type: string
        postId:
          type: string
        message:
          type: string

    StudioEventKind:
      type: string
      description: What happened on air. A closed list; unknown kinds are rejected.
      enum:
        [
          go_live,
          stream_ended,
          scene_saved,
          source_added,
          source_removed,
          stream_error,
          recording_started,
          recording_stopped,
          recording_finalised,
          recording_zoomed,
          recording_error,
        ]
    StudioEventInput:
      type: object
      required: [workspaceId, kind]
      properties:
        workspaceId:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/StudioEventKind"
        at:
          type: string
          format: date-time
          description: When it happened on the operator's clock. Defaults to now.
        payload:
          type: object
          additionalProperties: true
          description: >-
            Kind-specific detail — the ingest endpoint and path for go_live, the
            exit reason for stream_ended, the source label for source_added, the
            file path and byte count for recording_stopped, the codecs and
            whether the video was stream-copied for recording_finalised, the
            keyframe count and render time for recording_zoomed.
            Never a credential.
        causedBy:
          type: array
          items: { type: string }
          maxItems: 16
          description: Ids of earlier events this one follows from.
    StudioEvent:
      type: object
      required: [id, workspaceId, kind, at, payload, causedBy, seq]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        kind:
          $ref: "#/components/schemas/StudioEventKind"
        at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
        causedBy:
          type: array
          items: { type: string }
        seq:
          type: number
          description: The store's sequence number when this event was written.
    StoreReceipt:
      type: object
      required: [head, seq, verified]
      description: >-
        The store's Merkle head and sequence right after a write, and whether the
        whole chain still verifies. This is what makes an event a receipt rather
        than a log line.
      properties:
        head: { type: string }
        seq: { type: number }
        verified: { type: boolean }
    StudioEventReceipt:
      type: object
      required: [event, receipt]
      properties:
        event:
          $ref: "#/components/schemas/StudioEvent"
        receipt:
          $ref: "#/components/schemas/StoreReceipt"
    StudioEventList:
      type: object
      required: [events, receipt]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/StudioEvent"
        receipt:
          $ref: "#/components/schemas/StoreReceipt"
    StudioEventTrace:
      type: object
      required: [event, causes, effects]
      properties:
        event:
          $ref: "#/components/schemas/StudioEvent"
        causes:
          type: array
          description: Transitive causes, nearest first.
          items:
            $ref: "#/components/schemas/StudioEvent"
        effects:
          type: array
          description: Direct effects — events that name this one as a cause.
          items:
            $ref: "#/components/schemas/StudioEvent"
    StudioSceneInput:
      type: object
      required: [scene]
      properties:
        scene:
          type: object
          additionalProperties: true
          description: The Studio's Scene object — layers with normalised rects. Stored as-is.
    StudioSceneDocument:
      type: object
      required: [workspaceId, scene, version, savedAt, lastEventId]
      properties:
        workspaceId: { type: string }
        scene:
          type: object
          additionalProperties: true
        version:
          type: number
          description: Increments on every save; AS OF on the store can recover any earlier one.
        savedAt: { type: string, format: date-time }
        lastEventId:
          type: string
          description: The scene_saved event that recorded this version.
    StudioSceneSaved:
